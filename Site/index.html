            <label for="email">Email</label>

            <input type="password" id="senha" required>
            <p>Já possui cadastro? Faça o login <a href="login.html">aqui</a></p>

    <script>
      function pegar_dados(){
          const dados = {
              nome: document.getElementById("nome").value,
              cpf: document.getElementById("cpf").value,
              celular: document.getElementById("celular").value,
              email: document.getElementById("email").value,
              senha: document.getElementById("senha").value
          }
          return dados
      }
    
      const form_cadastro = document.getElementById("form_cadastro")
      const btn_enviar = document.getElementById("btn_enviar")
      form_cadastro.addEventListener("submit", async (event)=>{
          event.preventDefault()
          btn_enviar.disabled = true
          btn_enviar.value = "Enviando cadastro..."

          const dados = pegar_dados()
          //alert(JSON.stringify(dados))
          try {
              const resposta = await fetch("http://10.216.243.142:3000/cliente", {
                  method: "POST",
                  headers: { "Content-Type": "application/json"},
                  body: JSON.stringify(dados)
              })
              if (!resposta.ok){throw new Error("Erro na API")}
              alert("O cadastro foi realizado!")
              form_cadastro.reset()
          } catch(error) {
              alert(error)
          } finally {
              btn_enviar.value = "Enviar Cadastro"
              btn_enviar.disabled = false
          }
      }) 
    </script>
