<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Produtos</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#">
                    <img src="logo.png" height="130" alt="130">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">CARRINHO</a>
                        </li>
                        <li class="nav-item" id="nav-login">
                            <a class="nav-link" href="login.html">LOGIN</a>
                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Olá, usuário
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section>
            <h1>Produtos</h1>
            <p>Confira os produtos cadastrados na Moonie.</p>

            <!-- FILTROS DE BUSCA -->
            <div class="barra-filtros">
                <div class="campo-filtro campo-busca">
                    <label for="filtro-busca">Buscar produto</label>
                    <input
                        type="search"
                        id="filtro-busca"
                        placeholder="Pesquisar produtos..."
                    >
                </div>

                <div class="campo-filtro">
                    <label for="filtro-categoria">Categoria</label>
                    <select id="filtro-categoria">
                        <option value="" selected>Todas as categorias</option>
                        <option value="Roupas">Roupas</option>
                        <option value="Acessórios">Acessórios</option>
                        <option value="Bolsas">Bolsas</option>
                        <option value="Joias">Joias</option>
                        <option value="Decoração">Decoração</option>
                        <option value="Papelaria">Papelaria</option>
                        <option value="Calçados">Calçados</option>
                        <option value="Kits">Kits</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="filtro-preco-min">Preço mínimo (R$)</label>
                    <input
                        type="number"
                        id="filtro-preco-min"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                    >
                </div>

                <div class="campo-filtro">
                    <label for="filtro-preco-max">Preço máximo (R$)</label>
                    <input
                        type="number"
                        id="filtro-preco-max"
                        min="0"
                        step="0.01"
                        placeholder="999,99"
                    >
                </div>

                <div class="campo-filtro">
                    <label for="filtro-ordenacao">Ordenar por</label>
                    <select id="filtro-ordenacao">
                        <option value="" selected>Padrão</option>
                        <option value="menor preco">Menor preço primeiro</option>
                        <option value="maior preco">Maior preço primeiro</option>
                    </select>
                </div>

                <div class="acoes-filtro">
                    <button id="btn-filtrar" type="button">Filtrar</button>
                    <button id="btn-limpar" type="button" class="btn-secundario">Limpar</button>
                </div>
            </div>
            <!-- FIM FILTROS DE BUSCA -->
        </section>

        <section>
            <div class="lista-estoque" id="lista-produtos">
                <!-- Os produtos serão carregados do banco pela API -->
            </div>

            <!-- PAGINAÇÃO -->
            <div class="paginacao">
                <button id="btn-anterior" type="button">◀ Anterior</button>
                <span id="info-pagina" class="info-pagina">Página 1</span>
                <button id="btn-proximo" type="button">Próximo ▶</button>
            </div>
            <!-- FIM PAGINAÇÃO -->
        </section>
    </main>

    <!-- ALERTA TOAST -->
    <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">
                    Mensagem
                </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
    <!-- FIM ALERTA TOAST -->
    <footer> </footer>

    <script src="./pages.js"></script>
    <script src="./produtos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
